services:
  mailpit:
    image: axllent/mailpit:v1.30.0
    container_name: secure-auth-mailpit
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit_data:/data

volumes:
  mailpit_data:
